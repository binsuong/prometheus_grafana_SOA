name: prometheus-grafana

networks:
  app-net:
  monitor-net:

volumes:
  prometheus_data:
  grafana_data:

services:
  app:
    build: ./src
    container_name: demo-app
    networks:
      - app-net
      - monitor-net
    ports:
      - "8000:8000"
    restart: unless-stopped

  fakeuser:
    build: ./src
    container_name: demo-fakeuser
    command: ["python", "fakeuser.py"]
    environment:
      TARGET: "http://app:8000"
    depends_on:
      - app
    networks:
      - app-net
    restart: unless-stopped

  spam_request:
    build: ./src
    container_name: demo-spam_request
    command: ["python", "spam_request.py"]
    environment:
      TARGET: "http://app:8000"
    ports:
      - "8080:8080"
    networks:
      - app-net
    depends_on:
      - app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: demo-prometheus
    command: 
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    networks:
      - monitor-net
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0
    container_name: demo-grafana
    environment: 
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ACCOUNT:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/demo.json
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.meomeo.baby
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitor-net
    ports:
      - "3000:3000"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    container_name: demo-tunnel
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    networks:
      - monitor-net
      - app-net
    restart: unless-stopped