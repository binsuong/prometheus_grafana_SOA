apiVersion: 1

providers:
  - name: demo-dashboard # A uniquely identifiable name for the provider
    folder: Demo # The folder where to place the dashboards
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
        # Default path for Windows: C:/Program Files/GrafanaLabs/grafana/public/dashboards
        # Default path for Linux is: /var/lib/grafana/dashboards