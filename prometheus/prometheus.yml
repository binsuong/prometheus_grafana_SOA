global:
 scrape_interval: 5s
scrape_configs:
 - job_name: prometheus
   static_configs:
    - targets:
      - 'localhost:9090'

 - job_name: 'python-app'
   static_configs:
    - targets:
      - 'app:8000'

 - job_name: 'cadvisor'
   static_configs:
    - targets:
      - 'cadvisor:8080'

 - job_name: 'node-exporter'
   static_configs:
    - targets:
      - 'node_exporter:9100'

 - job_name: 'dead-targets'
   static_configs:
    - targets:
      - '10.255.255.1:9999'